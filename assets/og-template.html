<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>D3CYPH3R · OG image template</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&family=VT323&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1200px;
      height: 630px;
      background: #06080b;
      color: #c9d1d9;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 0 80px;
      -webkit-font-smoothing: antialiased;
    }

    .wordmark {
      font-size: 168px;
      letter-spacing: 10px;
      line-height: 1;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Brightness-cascade glyph palette — matches the lobby + walkthroughs
       brand. VT323 wordmark glyphs in three brightness levels, framed by
       dim JetBrains Mono brackets. Hardcoded colors (no CSS-variable
       theme flip) because the OG image is a single static export — dark
       palette only. */
    .glyph-vt323   { font-family: 'VT323', 'Courier New', monospace; font-size: 1.25em; }
    .glyph-bright  { color: #ffffff; }
    .glyph-mid     { color: #c9d1d9; }
    .glyph-dim     { color: #6e7681; }
    .glyph-bracket {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      color: #6e7681;
      font-weight: 400;
      font-size: 0.7em;
      margin: 0 16px;
    }

    .tagline {
      color: #c9d1d9;
      font-size: 30px;
      text-align: center;
      margin-bottom: 52px;
      font-weight: 400;
    }

    .prompt {
      color: #6e7681;
      font-size: 24px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0;
    }
    .prompt .pu { color: #3fb950; font-weight: 500; }
    .prompt .at { color: #6e7681; }
    .prompt .ph { color: #56d4dd; }
    .prompt .d  { color: #f0f6fc; }
    .prompt .c  { color: #f0f6fc; }
  </style>
</head>
<body>
  <div class="wordmark">
    <span class="glyph-bracket">[</span><span class="glyph-vt323 glyph-bright">D</span><span class="glyph-vt323 glyph-mid">3</span><span class="glyph-vt323 glyph-mid">C</span><span class="glyph-vt323 glyph-bright">Y</span><span class="glyph-vt323 glyph-dim">P</span><span class="glyph-vt323 glyph-mid">H</span><span class="glyph-vt323 glyph-dim">3</span><span class="glyph-vt323 glyph-bright">R</span><span class="glyph-bracket">]</span>
  </div>

  <div class="tagline">Terminal CTF for infrastructure people</div>

  <div class="prompt">
    <span class="pu">guest</span><span class="at">@</span><span class="ph">d3cyph3r</span><span class="d">:~$</span>&nbsp;<span class="c">ssh level0@linux</span>
  </div>
</body>
</html>
