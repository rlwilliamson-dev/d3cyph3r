<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>D3CYPH3R · OG image template</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&family=VT323&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1200px;
      height: 630px;
      background: #06080b;
      color: #c9d1d9;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 0 80px;
      -webkit-font-smoothing: antialiased;
    }

    .wordmark {
      font-size: 168px;
      font-weight: 700;
      letter-spacing: 18px;
      line-height: 1;
      margin-bottom: 40px;
    }

    .glyph-mono              { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .glyph-courier           { font-family: 'Courier New', 'Courier', monospace;         font-size: 1.18em; }
    .glyph-vt323             { font-family: 'VT323', 'Courier New', monospace;            font-size: 1.25em; }
    .glyph-share-tech        { font-family: 'Share Tech Mono', 'Courier New', monospace;  font-size: 0.98em; }
    .glyph-share-tech-italic { font-family: 'Share Tech Mono', 'Courier New', monospace;  font-size: 0.98em; font-style: italic; }

    .glyph-white  { color: #ffffff; }
    .glyph-green  { color: #00ff00; }
    .glyph-cyan   { color: #00ffff; }
    .glyph-accent { color: #5b8fff; }
    .glyph-red    { color: #cc0000; }

    .tagline {
      color: #c9d1d9;
      font-size: 30px;
      text-align: center;
      margin-bottom: 52px;
      font-weight: 400;
    }

    .prompt {
      color: #6e7681;
      font-size: 24px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0;
    }
    .prompt .pu { color: #3fb950; font-weight: 500; }
    .prompt .at { color: #6e7681; }
    .prompt .ph { color: #56d4dd; }
    .prompt .d  { color: #f0f6fc; }
    .prompt .c  { color: #f0f6fc; }
  </style>
</head>
<body>
  <div class="wordmark">
    <span class="glyph-mono glyph-white">D</span><span class="glyph-vt323 glyph-green">3</span><span class="glyph-share-tech-italic glyph-cyan">C</span><span class="glyph-vt323 glyph-accent">Y</span><span class="glyph-courier glyph-red">P</span><span class="glyph-mono glyph-white">H</span><span class="glyph-vt323 glyph-green">3</span><span class="glyph-share-tech glyph-white">R</span>
  </div>

  <div class="tagline">Terminal CTF for infrastructure people</div>

  <div class="prompt">
    <span class="pu">guest</span><span class="at">@</span><span class="ph">d3cyph3r</span><span class="d">:~$</span>&nbsp;<span class="c">ssh level0@linux</span>
  </div>
</body>
</html>
