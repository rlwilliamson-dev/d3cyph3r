<!DOCTYPE html>
<!--
  D3CYPH3R — single-page entry point.

  Pure static ES modules: no build step, no bundler. Loaded directly
  by the browser via `<script type="module" src="js/main.js">`. All
  rendering happens inside #screen; js/main.js wires DOM refs to
  engine state at boot.

  DOM contract (every id below is read by js/terminal/dom.js):
    #screen          full-height column flex container
    #topbar          fixed top strip (title / level badge / clock)
    #progress-bar    thin progress strip below topbar
      #progress-fill green fill driven by js/engine/progress.js
    #terminal        scrollable output region; print() appends here
    #input-area      bottom row: prompt label + input + tab-hint
      #prompt-user / #prompt-host  dynamic per-level prompt labels
      #input-wrapper                cursor-mirror container — see below

  The cursor-mirror trick:
  ────────────────────────
  The real <input id="cmd-input"> is positioned over the wrapper but
  rendered invisible (opacity 0 in style.css). The visible "cursor"
  is the three sibling spans inside #input-wrapper:
    #mirror-before — text to the left of the caret
    #mirror-cursor — the blinking block character itself
    #mirror-after  — text to the right of the caret
  js/terminal/input.js keeps the spans in sync with cmdInput.value
  and cmdInput.selectionStart on every keystroke / click / arrow key.

  Why? Custom monospace fonts (VT323 / Share Tech Mono) don't render
  a native text-input caret consistently across browsers, and the
  default caret color/width can't be styled to match the retro
  look we want. Rendering the cursor as a styled span gives pixel-
  perfect control while keeping the underlying <input> functional
  for IME, paste, screen-readers, and OS-level shortcuts.
-->

  <meta property="og:description" content="A browser-based terminal CTF for DevOps engineers, SREs, and SysAdmins learning cybersecurity. Play a new hire at Driftwood Systems and find what got left exposed.">

  <!-- ?v=<version> cache-busts the stylesheet on each release so
       returning visitors don't see up-to-4-hours of stale styling
       after a deploy. Bump this string when bumping version.js. -->
  <link rel="stylesheet" href="style.css?v=1.1.0">
</head>
<body>

  <div id="screen">

    <div id="topbar">
      <span class="title glitch" id="topbar-title">D3CYPH3R</span>
      <div class="topbar-right">
        <span class="status" id="level-badge">NOT CONNECTED</span>
        <!-- Theme toggle. Shows moon in dark mode (click → light) and
             sun in light mode (click → dark). State persisted to
             localStorage by js/terminal/theme.js. -->
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle light / dark theme" title="Toggle light / dark">
          <svg class="theme-icon theme-icon-moon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
            <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.78.78 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.78.78 0 0 1 6 .278"/>
          </svg>
          <svg class="theme-icon theme-icon-sun" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
            <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/>
          </svg>
        </button>
        <span class="clock" id="clock">00:00:00</span>
      </div>
    </div>

    <div id="progress-bar">
      <div id="progress-fill"></div>
    </div>

    <div id="terminal"></div>

    <div id="input-area">
      <span id="prompt-label">
        <span id="prompt-user">guest</span><span class="at">@</span><span
          id="prompt-host" class="host">d3cyph3r</span><span class="dollar">:~$&nbsp;</span>
      </span>

      <div id="input-wrapper">
        <span id="mirror-before"></span><span id="mirror-cursor" class="cursor-inline">▋</span><span id="mirror-after"></span>
        <input id="cmd-input" type="text" autocomplete="off" spellcheck="false" autofocus />
      </div>

      <span id="tab-hint"></span>
    </div>

    <!-- Footer: in-site nav + source + hosting attribution. Subtle/dim
         styling so it sits below the prompt without competing for
         player attention. Walkthroughs link is first because it's the

  </div>

  <script type="module" src="js/main.js"></script>

</body>
