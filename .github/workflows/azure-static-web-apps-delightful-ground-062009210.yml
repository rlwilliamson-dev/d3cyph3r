# Azure Static Web Apps CI/CD
#
# IMPORTANT — manual edits to watch for if Azure regenerates this file:
#   1. The `playtest_job` below was added by hand.
#   2. `build_and_deploy_job` has a `needs: playtest_job` line and an
#      `if:` that allows deploys when playtest is SKIPPED (PR pushes)
#      as well as when it succeeds — a failed playtest still blocks.
#   3. `actions/checkout` is pinned to v6 (Azure's generator uses v3).
#   4. The workflow trigger uses `paths-ignore` (v1.24.2+) to skip the
#      whole workflow on docs-only changes.
#   5. The playtest_job uses a 4-shard matrix (v1.24.2+) and is gated
#      to push-to-main + manual dispatch only (v1.24.2+).
# If Azure rewrites this file (e.g. after reconfiguring the SWA in the
# portal), restore those things from git history.

name: Azure Static Web Apps CI/CD

# v1.24.2 — Triggering rules:
#   - push to main: ALWAYS runs the workflow (playtest gates deploy).
#   - pull_request: workflow runs to deploy a preview, but playtest_job
#     skips (see its `if:` below). Local playtest is the iteration loop.
#   - workflow_dispatch: manual escape hatch — forces playtest on any
#     branch via the Actions UI.
#   - paths-ignore: docs files that aren't deployed (or aren't engine
#     code) skip the workflow entirely. Walkthrough markdown files are
#     NOT in the ignore list because they ARE deployed and need preview.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/**.md'
      - '.gitignore'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  playtest_job:
    # v1.24.2 — Playtest runs only when:
    #   (a) The merge commit lands on main (the canonical deploy gate), OR
    #   (b) The maintainer manually dispatches the workflow.
    # PR pushes do NOT trigger playtest. Local playtest
    # (`cd tests && npx playwright test`) is the developer-iteration
    # safety net; the merge-to-main run catches anything local missed.
    # If a PR-stage CI run is needed (e.g., infra changes affect CI
    # behavior), use "Actions → Run workflow" against the PR branch.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    # v1.24.2 — 4-shard matrix. Each shard runs `--shard N/4`, picking
    # up roughly a quarter of the test() blocks. fail-fast: false so a
    # single shard's failure doesn't cancel the others mid-flight (gives
    # us full diagnostic coverage on failed runs). All shards must
    # succeed for build_and_deploy_job's `needs:` gate to pass.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    name: Playtest (shard ${{ matrix.shard }}/4)
    # v1.24.4 — explicit minimal permissions. CodeQL flagged the
    # implicit GITHUB_TOKEN scope (default for 2023+ repos is already
    # `contents: read`, but explicit declaration is best practice and
    # silences the alert).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json
      - name: Install playtest dependencies
        working-directory: tests
        run: npm ci
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          echo $! > /tmp/d3_server.pid
      - name: Wait for server
        run: timeout 30 bash -c 'until curl -sf http://localhost:8000/ >/dev/null; do sleep 1; done'
      - name: Run playtest shard
        working-directory: tests
        env:
          D3CYPH3R_URL: http://localhost:8000/
        # As of v1.24.0, the playtest uses @playwright/test with per-spec
        # parallelism. v1.24.1 bumped CI workers from 2 to 4 to match
        # ubuntu-latest's 4 vCPUs. v1.24.2 added shard splitting so the
        # 4 workers in each of 4 parallel runners process ~73 tests
        # apiece instead of 293. Wall time bounded by slowest shard.
        run: npx playwright test --shard ${{ matrix.shard }}/4 --reporter=list
      - name: Stop static server
        if: always()
        run: kill "$(cat /tmp/d3_server.pid)" 2>/dev/null || true

  walkthrough_drift_job:
    # v2.4.0 — Guards the generated walkthrough pages.
    #
    # walkthroughs/<track>/<level>.html is generated from the matching
    # .md by tools/build-walkthroughs.mjs and COMMITTED. That gives us
    # static pages with no build step on the deploy path, at the cost of
    # one failure mode: someone edits the markdown, forgets to
    # regenerate, and the published page silently no longer matches its
    # source.
    #
    # This job closes that gap by re-running the generator and failing
    # if anything changed. Unlike playtest_job it runs on PRs as well,
    # because catching the drift BEFORE merge is the entire point. It
    # needs no npm install (the generator has zero dependencies), so it
    # costs a few seconds.
    if: |
      github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Walkthrough generator is up to date
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Regenerate walkthrough pages
        run: node tools/build-walkthroughs.mjs
      - name: Fail if generated output differs from what was committed
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated walkthrough files are stale."
            echo ""
            echo "A tracked file changed when the generator re-ran, which"
            echo "means committed output does not match its source."
            echo ""
            echo "Fix: run 'node tools/build-walkthroughs.mjs' locally and"
            echo "commit the result."
            echo ""
            echo "Files that differ:"
            git --no-pager diff --stat
            exit 1
          fi
          echo "Generated walkthrough output matches the committed files."

  build_and_deploy_job:
    needs: [playtest_job, walkthrough_drift_job]
    # v1.24.2 — Allow deploys when playtest_job is SKIPPED (PR pushes,
    # where playtest doesn't run by design) OR when ALL shards SUCCEED.
    # Block only on playtest failure or cancellation.
    #
    # The default `needs:` semantics would skip build_and_deploy_job
    # when its dependency is skipped — we override that with
    # `if: !cancelled() && needs.playtest_job.result != 'failure'`.
    #
    # v2.4.0 — walkthrough_drift_job is gated the same way. It is NOT
    # skipped on PRs, so its failure blocks a preview deploy as well as
    # a production one: publishing a page that disagrees with its own
    # markdown source is exactly what this check exists to prevent.
    if: |
      !cancelled() &&
      needs.playtest_job.result != 'failure' &&
      needs.walkthrough_drift_job.result != 'failure' &&
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # GITHUB_TOKEN's default permissions since 2023 are `contents: read`
    # only. The SWA action wants to post a preview-URL comment on PRs
    # via the GitHub API — without `pull-requests: write` it gets a 403
    # and the build log shows "Unexpectedly failed to add GitHub comment"
    # (the deploy still succeeds; just the comment fails).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - name: Prune dev/docs files from deploy payload
        # SWA's `app_location: "/"` ships the entire repo to the CDN.
        # That accidentally publishes ~300 KB of contributor docs and
        # CI artifacts that have no business being on the edge:
        #   - tests/                 — CI-only (Playwright suite + deps)
        #   - tools/                 — local dev scratch (icon mockups,
        #                              etc.); v1.24.3 added — was leaking
        #                              an unused HTML file to prod
        #   - CHANGELOG.md           — public on GitHub already
        #   - README.md              — same; GitHub renders it natively
        #   - CONTRIBUTING.md        — same
        #   - walkthroughs/README.md — author guide for new walkthroughs,
        #                              not the player-facing /walkthroughs/
        #   - .mailmap               — git-tooling metadata, dev-only
        #   - .gitignore             — exposes repo layout, no consumer
        #
        # KEPT on purpose:
        #   - LICENSE / SECURITY.md  — legal + security-disclosure
        #                              conventions (security researchers
        #                              look for /SECURITY.md)
        #   - 404.html / robots.txt /
        #     sitemap.xml /
        #     favicon.svg / og-image.png — required for the site to work
        #
        # If you fork: trim or expand this list to taste. Anything not
        # rm'd here ends up on the CDN.
        run: |
          rm -rf tests/ tools/
          rm -f CHANGELOG.md README.md CONTRIBUTING.md walkthroughs/README.md .gitignore .mailmap

      - name: Decide deployment target
        id: target
        # A manual run on a feature branch must not reach production.
        #
        # The SWA action deploys to the PRODUCTION environment whenever
        # `deployment_environment` is empty. That is correct for a push
        # to main, and it is what makes `pull_request` runs safe too
        # (the action creates a per-PR preview on its own). But
        # `workflow_dispatch` had no such protection: dispatching this
        # workflow on any branch published that branch to
        # www.d3cyph3r.com.
        #
        # That is not hypothetical. On 2026-08-06 the `pull_request`
        # event stopped being delivered, the workflow was dispatched by
        # hand to get the checks to run, and unreviewed branch code went
        # live for several hours while main sat six releases behind.
        #
        # workflow_dispatch is still the right escape hatch for forcing
        # the playtest on a branch; it just gets a named preview instead
        # of the production slot. Dispatching on main still deploys to
        # production, which is the one case where that is intended.
        #
        # Every manual run shares ONE environment, deliberately. The
        # first draft of this used a per-branch name and that was wrong
        # for two reasons, both found by actually dispatching it:
        #
        #   1. Azure rewrites the name. It strips every non-alphanumeric
        #      character and truncates to 16, so the branch-derived
        #      'manual-ci-no-accidental-prod-deploy' landed as
        #      'manualcinoaccide'. The run would then report a URL that
        #      did not exist, and two branches sharing a 16-char prefix
        #      would silently collide anyway.
        #
        #   2. Nothing ever deletes them. close_pull_request_job cleans
        #      up a PR preview because a PR emits a `closed` event; a
        #      manual dispatch emits nothing, so each new branch would
        #      consume a preview slot permanently. The Free plan allows
        #      3 per app, which the PR previews already occupy, so the
        #      second or third dispatch fails the deploy with
        #      "maximum number of staging environments".
        #
        # A single fixed name fixes both: it survives truncation intact,
        # and repeat dispatches overwrite it instead of accumulating. It
        # costs one of the 3 slots once, forever, rather than one per
        # branch. Which branch is deployed there is not lost: it is in
        # the notice below and on the run itself.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ github.ref_name }}" != "main" ]; then
            echo "environment=manual" >> "$GITHUB_OUTPUT"
            echo "::notice title=Preview deploy::Manual run on '${{ github.ref_name }}' deploys to the shared 'manual' preview environment, NOT production. It replaces whatever was there before."
          else
            echo "environment=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_GROUND_062009210 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          # Empty = production. Set only for a manual run on a branch;
          # see "Decide deployment target" above for why.
          #
          # The runner logs "Unexpected input(s) 'deployment_environment'"
          # here. Ignore it, and do NOT delete this line to silence it.
          # The input is the documented way to target a named preview
          # environment (learn.microsoft.com/azure/static-web-apps/
          # named-environments); the warning comes from the action.yml at
          # the resolved v1 tag being older than the action's own docs.
          # Undeclared inputs are still passed through as INPUT_* env
          # vars, and the deploy honours it: the run log confirms with
          # "You are using named preview environments".
          deployment_environment: ${{ steps.target.outputs.environment }}
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "." # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    # v1.24.4 — explicit minimal permissions (see playtest_job above).
    permissions:
      contents: read
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_GROUND_062009210 }}
          action: "close"
