# Azure Static Web Apps CI/CD
#
# IMPORTANT — manual edits to watch for if Azure regenerates this file:
#   1. The `playtest_job` below was added by hand.
#   2. `build_and_deploy_job` has a `needs: playtest_job` line so a failed
#      playtest blocks the deploy.
#   3. `actions/checkout` is pinned to v6 (Azure's generator uses v3).
# If Azure rewrites this file (e.g. after reconfiguring the SWA in the portal),
# restore those three things from git history.

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  playtest_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Playtest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json
      - name: Install playtest dependencies
        working-directory: tests
        run: npm ci
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          echo $! > /tmp/d3_server.pid
      - name: Wait for server
        run: timeout 30 bash -c 'until curl -sf http://localhost:8000/ >/dev/null; do sleep 1; done'
      - name: Run playtest
        working-directory: tests
        env:
          D3CYPH3R_URL: http://localhost:8000/
        run: node playtest.cjs
      - name: Stop static server
        if: always()
        run: kill "$(cat /tmp/d3_server.pid)" 2>/dev/null || true

  build_and_deploy_job:
    needs: playtest_job
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_GROUND_062009210 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "." # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_GROUND_062009210 }}
          action: "close"
