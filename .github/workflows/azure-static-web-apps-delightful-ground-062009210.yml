# Azure Static Web Apps CI/CD
#
# IMPORTANT — manual edits to watch for if Azure regenerates this file:
#   1. The `playtest_job` below was added by hand.
#   2. `build_and_deploy_job` has a `needs: playtest_job` line so a failed
#      playtest blocks the deploy.
#   3. `actions/checkout` is pinned to v6 (Azure's generator uses v3).
# If Azure rewrites this file (e.g. after reconfiguring the SWA in the portal),
# restore those three things from git history.

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  playtest_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Playtest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json
      - name: Install playtest dependencies
        working-directory: tests
        run: npm ci
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          echo $! > /tmp/d3_server.pid
      - name: Wait for server
        run: timeout 30 bash -c 'until curl -sf http://localhost:8000/ >/dev/null; do sleep 1; done'
      - name: Run playtest
        working-directory: tests
        env:
          D3CYPH3R_URL: http://localhost:8000/
        # As of v1.24.0, the playtest uses @playwright/test with
        # per-spec parallelism. playwright.config.cjs caps workers
        # to 2 in CI for GitHub-Actions-runner stability (the default
        # 2-vCPU runners flake under heavier oversubscription).
        run: npx playwright test --reporter=list
      - name: Stop static server
        if: always()
        run: kill "$(cat /tmp/d3_server.pid)" 2>/dev/null || true

  build_and_deploy_job:
    needs: playtest_job
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # GITHUB_TOKEN's default permissions since 2023 are `contents: read`
    # only. The SWA action wants to post a preview-URL comment on PRs
    # via the GitHub API — without `pull-requests: write` it gets a 403
    # and the build log shows "Unexpectedly failed to add GitHub comment"
    # (the deploy still succeeds; just the comment fails).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - name: Prune dev/docs files from deploy payload
        # SWA's `app_location: "/"` ships the entire repo to the CDN.
        # That accidentally publishes ~300 KB of contributor docs and
        # CI artifacts that have no business being on the edge:
        #   - tests/                 — CI-only (Playwright suite + deps)
        #   - CHANGELOG.md           — public on GitHub already
        #   - README.md              — same; GitHub renders it natively
        #   - CONTRIBUTING.md        — same
        #   - walkthroughs/README.md — author guide for new walkthroughs,
        #                              not the player-facing /walkthroughs/
        #   - .gitignore             — exposes repo layout, no consumer
        #
        # KEPT on purpose:
        #   - LICENSE / SECURITY.md  — legal + security-disclosure
        #                              conventions (security researchers
        #                              look for /SECURITY.md)
        #   - 404.html / robots.txt /
        #     sitemap.xml /
        #     favicon.svg / og-image.png — required for the site to work
        #
        # If you fork: trim or expand this list to taste. Anything not
        # rm'd here ends up on the CDN.
        run: |
          rm -rf tests/
          rm -f CHANGELOG.md README.md CONTRIBUTING.md walkthroughs/README.md .gitignore
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_GROUND_062009210 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "." # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_GROUND_062009210 }}
          action: "close"
